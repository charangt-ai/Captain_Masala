name: captain_masala
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  excel: ^4.0.6
  url_launcher: ^6.3.2
  intl: ^0.20.3
  firebase_core: 4.11.0
  cloud_firestore: 6.6.0
  firebase_auth: 6.5.4
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  whatsapp_share2: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
